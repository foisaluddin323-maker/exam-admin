<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Exam Master অ্যাডমিন</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>

/* Layout: phone = top bar + 5 bottom tabs ("আরও" opens the rest); desktop = left sidebar with every page.
   Default theme is a soft, low-glare green-grey for long reading; bright, dark and auto are switchable in চেহারা. */
:root{
  --bg:#e9efeb; --surface:#f6f9f7; --ink:#10201d; --muted:#445a55; --line:#c6d4ce;
  --accent:#0b6b63; --accent-ink:#ffffff; --accent-soft:#cfe6e0;
  --good:#146c34; --good-soft:#d3eddb; --warn:#8a4a07; --warn-soft:#f6e3bd; --bad:#a51d1d; --bad-soft:#f5d6d6;
  --side:#0d2b28; --side-ink:#d3e6e2; --side-on:#17493f;
  --f-display:'Anek Bangla','Hind Siliguri',system-ui,sans-serif; --f-body:'Hind Siliguri',system-ui,sans-serif;
  --fs:17px;
}
:root[data-theme="light"]{
  --bg:#f5f8f7; --surface:#ffffff; --ink:#0a1714; --muted:#41564f; --line:#d5e0dc;
  --accent:#0f766e; --accent-soft:#d9efeb; --warn:#92400e; --bad:#b91c1c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="soft"]){
  --bg:#0e1917; --surface:#16251f; --ink:#eaf4f1; --muted:#a9c0ba; --line:#274039;
  --accent:#2dd4bf; --accent-ink:#04201c; --accent-soft:#14352f;
  --good:#4ade80; --good-soft:#12301d; --warn:#fbbf24; --warn-soft:#3a2c0b; --bad:#f87171; --bad-soft:#3b1717;
  --side:#08110f; --side-ink:#b4cbc6; --side-on:#13302b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1917; --surface:#16251f; --ink:#eaf4f1; --muted:#a9c0ba; --line:#274039;
  --accent:#2dd4bf; --accent-ink:#04201c; --accent-soft:#14352f;
  --good:#4ade80; --good-soft:#12301d; --warn:#fbbf24; --warn-soft:#3a2c0b; --bad:#f87171; --bad-soft:#3b1717;
  --side:#08110f; --side-ink:#b4cbc6; --side-on:#13302b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 var(--fs)/1.65 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;letter-spacing:.005em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.45em} h2{font-size:1.12em} h3{font-size:1em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.1em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.wrap{max-width:1100px;margin:0 auto;min-width:0}
.demo{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:9px 13px;font-size:.88em;margin-bottom:14px}
.mob{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
.mob button,.side button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;color:var(--muted);font-size:.74em;border-radius:12px;min-width:0}
.mob svg,.side svg{width:24px;height:24px;flex:none}
.mob button[aria-current="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.side{display:none}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}
.stat .n{font-family:var(--f-display);font-size:1.7em;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{color:var(--muted);font-size:.9em}
.stat .d{font-size:.8em;color:var(--good)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:.92em;margin:2px 0 0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.88em;min-height:36px;border-radius:10px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.good{background:var(--good-soft);color:var(--good)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;font-size:.78em;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.gray{background:var(--line);color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>div{min-width:0}
.t{font-weight:500;overflow-wrap:anywhere}
.s{font-size:.88em;color:var(--muted);overflow-wrap:anywhere}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools>*{flex:1 1 130px;min-width:0}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:88px;resize:vertical}
label{display:block;font-size:.88em;color:var(--muted);margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:10px;align-items:center;margin-top:8px}
.opt input[type=radio]{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1;min-height:0}
.sw i{position:absolute;inset:0;background:var(--muted);opacity:.45;border-radius:99px;transition:.15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--accent);opacity:1} .sw input:checked+i::after{transform:translateX(22px)}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:9px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin-top:6px}
.bar b{display:block;height:100%;background:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.seg{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:14px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1 0 auto;background:none;border:0;border-radius:10px;padding:8px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92em;z-index:20;max-width:90vw}
.msg{font-size:.88em;margin-top:8px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:26px 8px}
.menu{display:grid;grid-template-columns:1fr;gap:10px}
.menu button{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.menu .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.menu .ic svg{width:24px;height:24px}
.menu b{display:block;font-weight:600}
.menu span.d{font-size:.88em;color:var(--muted)}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);margin-top:8px}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.panel{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.themes button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left}
.themes button[aria-pressed="true"]{border-color:var(--accent)}
.sample{display:flex;gap:4px;margin-bottom:8px}.sample i{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.15)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{width:22px;height:22px;min-height:0;flex:none;margin-top:3px;accent-color:var(--accent)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;align-items:end}
.podium .card{text-align:center;padding:12px 8px}
.podium .p1{padding-block:22px;background:var(--accent-soft)}
.podium .n{font-family:var(--f-display);font-size:1.4em;font-weight:700}
@media (min-width:900px){
  body{padding-block:0 40px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .cols{display:grid;grid-template-columns:3fr 2fr;gap:12px;align-items:start}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .menu{grid-template-columns:1fr 1fr}
  .mob{display:none}
  .side{display:grid;position:fixed;top:0;bottom:0;left:0;width:230px;align-content:start;gap:3px;background:var(--side);padding:78px 12px 12px;overflow-y:auto;z-index:4}
  .side button{flex-direction:row;gap:12px;font-size:.95em;padding:10px 12px;color:var(--side-ink);justify-content:flex-start}
  .side button[aria-current="true"]{background:var(--side-on);color:#fff}
  .wrap{margin-left:230px;max-width:none;padding-left:24px}
  .top{position:fixed;top:0;left:0;width:230px;z-index:11;background:var(--side);color:#fff;padding:18px 16px}
  .top .iconbtn{display:none}
  body::before{display:none}
  .toast{bottom:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
.login{max-width:400px;margin:10vh auto 0}
.login h1{margin-bottom:6px}
.loading{text-align:center;color:var(--muted);margin-top:30vh}
code{background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:6px;font-size:.9em}

.podium .p1{padding-block:22px;background:linear-gradient(160deg,var(--accent-soft),var(--surface));border:2px solid var(--accent);box-shadow:0 4px 14px rgba(11,107,99,.18)}
.podium .p1 .n{color:var(--accent)}
.tools.two-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tools.two-row>*{flex:none}
.tools.two-row input{grid-column:1/-1}
.adv-toggle{display:flex;align-items:center;gap:8px;margin:14px 0 6px;cursor:pointer;user-select:none;color:var(--muted);font-size:.92em}
.adv-toggle svg{width:18px;height:18px;flex:none;transition:transform .15s}
.adv-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
.adv-box{display:none}.adv-box.open{display:block}
.example-json{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:.8em;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 8px;max-height:140px;overflow:auto}
@media (min-width:900px){.tools.two-row{grid-template-columns:2fr 1fr 1fr 1fr}.tools.two-row input{grid-column:auto}}
</style>

<script>
(function(){
  function show(extra){
    var l=document.getElementById('loading'); if(!l||l.hidden) return;
    l.style.marginTop='12vh';
    l.innerHTML='<div class="card" style="max-width:440px;margin:0 auto;text-align:left;color:var(--ink)"><h2>প্যানেল চালু হচ্ছে না</h2><p>এই কয়েকটা দেখে নিন:</p><ol style="padding-left:20px"><li>ফাইলটা চ্যাট প্রিভিউতে না খুলে <b>GitHub Pages লিংকে</b> (https://...github.io/...) Chrome-এ খুলুন।</li><li>ইন্টারনেট চালু আছে কিনা দেখুন। বিজ্ঞাপন ব্লকার বা VPN বন্ধ করে আবার চেষ্টা করুন।</li><li>পেজ রিফ্রেশ করুন (cache মুছে)।</li></ol>'+(extra?'<p style="font-size:.85em;color:var(--muted)">টেকনিক্যাল লেখা: '+extra+'</p>':'')+'</div>';
  }
  var last='';
  window.addEventListener('error',function(e){last=(e&&e.message)||'error';});
  window.addEventListener('unhandledrejection',function(e){last=(e&&e.reason&&(e.reason.code||e.reason.message))||'rejection';});
  setTimeout(function(){show(last);},9000);
})();
</script>

function applyLook(){

  r.style.setProperty('--fs', S.look.size + 'px');

/* ---------- ছোট সাহায্যকারী ---------- */
let TT;
function toast(t){ const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(TT); TT = setTimeout(() => e.hidden = true, 2800); }
function errMsg(e){ return e && e.code === 'permission-denied' ? 'অনুমতি নেই। Firestore রুলে এই অংশ যোগ করতে হবে (আরও → অ্যাডমিন ও সিকিউরিটি)।' : 'সমস্যা: ' + ((e && (e.code || e.message)) || 'অজানা'); }
async function run(p, okMsg){ try { await p; if (okMsg) toast(okMsg); return true; } catch(e) { toast(errMsg(e)); return false; } }
function log(m){ addDoc(collection(db,'audit'), {msg:m, by:(ME&&ME.email)||'', at:serverTimestamp()}).catch(() => {}); }
function opts(list, cur){ return list.map(s => `<option${s === cur ? ' selected' : ''}>${esc(s)}</option>`).join(''); }
function seg(name, list, cur){ return `<div class="seg" role="group">${list.map(x => `<button type="button" data-a="seg" data-n="${name}" data-v="${x[0]}" aria-pressed="${cur === x[0]}">${x[1]}</button>`).join('')}</div>`; }
function ask(k){ if (S.cf === k) { S.cf = null; return true; } S.cf = k; render(); return false; }
function delBtn(k, a, v, label){ return `<button class="btn sm danger" data-a="${a}" data-v="${v}">${S.cf === k ? 'নিশ্চিত করুন' : (label || 'মুছুন')}</button>`; }
function sw(attrs, on, label){ return `<label class="sw" aria-label="${esc(label)}"><input type="checkbox" ${attrs}${on ? ' checked' : ''}><i></i></label>`; }
function stBadge(s){ return `<span class="pill ${s === 'প্রকাশিত' || s === 'চালু' ? 'good' : s === 'খসড়া' ? 'gray' : s === 'শেষ' ? '' : 'warn'}">${s}</span>`; }
function fmtDate(t){ try { const d = t && t.toDate ? t.toDate() : new Date(t); if (isNaN(d)) return ''; return d.toLocaleDateString('bn-BD', {day:'numeric', month:'long'}); } catch(e) { return ''; } }
function subjects(){ const s = Object.keys(CFG.struct); Q.forEach(q => { if (q.subject && s.indexOf(q.subject) < 0) s.push(q.subject); }); return s; }
function qn(q){ return {...q, bank:q.bank || 'HSC বোর্ড', status:q.status || 'প্রকাশিত', type:q.type || 'MCQ', options:Array.isArray(q.options) ? q.options : ['','','',''], answer:typeof q.answer === 'number' ? q.answer : 0}; }
function en(e){ return {...e, type:e.type || 'Academic', status:e.status || (e.live ? 'চালু' : 'খসড়া'), count:+e.count || 0, duration:+e.duration || 0, negative:+e.negative || 0}; }
function ownMode(e){ return e.type === 'Live' || e.type === 'Weekly'; }
function inGroup(e, q){ return e.type === 'Mega' ? q.bank === 'মেগা' : (e.type === 'Academic' ? (q.bank === 'HSC বোর্ড' || q.bank === 'স্মার্ট প্র্যাকটিস') : true); }
function qcount(e){ return Array.isArray(e.items) ? `প্রশ্ন ${bn(e.items.length)}/${bn(e.count)} যোগ হয়েছে` : `${bn(e.count)}টি প্রশ্ন`; }

/* ---------- লগইন ---------- */
async function login(){
  $('loginErr').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value); }
  catch(e){ $('loginErr').textContent = 'লগইন হয়নি। ইমেইল ও পাসওয়ার্ড ঠিক আছে কিনা দেখুন।'; }
}
onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = []; $('loading').hidden = true;
  if (u && u.uid === ADMIN_UID) {
    ME = u; $('loginView').hidden = true; $('appView').hidden = false; listen(); applyLook(); render();
  } else {
    if (u) { signOut(auth); $('loginErr').textContent = 'এই অ্যাকাউন্টের অ্যাডমিন অনুমতি নেই।'; }
    ME = null; $('loginView').hidden = false; $('appView').hidden = true;
  }
});

/* ---------- ডেটা শোনা ---------- */
function softRender(){
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('main').contains(a)) return;
  render();
}
function listen(){
  const onCol = (name, fn) => unsubs.push(onSnapshot(collection(db, name),
    s => { delete perm[name]; fn(s.docs.map(d => ({id:d.id, ...d.data()}))); softRender(); },
    e => { perm[name] = e.code || 'error'; softRender(); }));
  const onDoc = (name, fn) => unsubs.push(onSnapshot(doc(db, 'config', name),
    s => { delete perm['config']; fn(s.exists() ? s.data() : null); softRender(); },
    e => { perm['config'] = e.code || 'error'; softRender(); }));
  onCol('questions', d => { Q = d.map(qn); });
  onCol('exams', d => { E = d.map(en).sort((a,b) => (b.createdAt && b.createdAt.seconds || 0) - (a.createdAt && a.createdAt.seconds || 0)); });
  onCol('users', d => { U = d; });
  onCol('reports', d => { R = d; });
  onCol('notices', d => { N = d; });
  onCol('audit', d => { AUD = d.sort((a,b) => (b.at && b.at.seconds || 0) - (a.at && a.at.seconds || 0)).slice(0, 40); });
  onDoc('app', d => { CFG.app = {...DEFAULT_APP, ...(d || {})}; });
  onDoc('struct', d => { CFG.struct = d && d.data ? d.data : DEFAULT_STRUCT; });
  onDoc('missions', d => { CFG.missions = d && d.list ? d.list : DEFAULT_MISSIONS; });
  onDoc('security', d => { CFG.sec = d || {}; });
}

function parseAns(r){
  const v = r.answer !== undefined && r.answer !== null ? r.answer : r.a;
  if (v === undefined || v === null) return -1;
  if (typeof v === 'number') return Number.isInteger(v) && v >= 0 && v < 4 ? v : -1;
  const s = String(v).trim().toLowerCase(), m = {'ক':0,'খ':1,'গ':2,'ঘ':3,'a':0,'b':1,'c':2,'d':3};
  return s in m ? m[s] : -1;
}
function normSubject(sub, paper){
  sub = String(sub || '').trim(); paper = String(paper || '').trim();
  if (!sub) return '';
  const alias = {'তথ্য ও যোগাযোগ প্রযুক্তি':'ICT','আইসিটি':'ICT'}; sub = alias[sub] || sub;
  if (paper && paper !== 'একক পত্র' && subjects().indexOf(sub + ' ' + paper) > -1) return sub + ' ' + paper;
  return sub;
}
function chMatch(qc, c){
  if (c === 'সব অধ্যায়') return true; qc = (qc || '').trim(); if (!qc) return false;
  const i = c.indexOf(':'), key = i > -1 ? c.slice(0, i).trim() : c, name = i > -1 ? c.slice(i + 1).trim() : c;
  return qc.indexOf(key) === 0 || (name && (qc.indexOf(name) > -1 || name.indexOf(qc) > -1));
}
function parseRows(text, def){
  let arr; try { arr = JSON.parse(text); if (!Array.isArray(arr)) throw 0; } catch(e) { return {err:'JSON ঠিক নেই। [ ] এর ভেতরে প্রশ্নের তালিকা দিন।'}; }
  const ok = [], bad = [];
  arr.forEach((r, i) => {
    r = r || {};
    let o = r.options || r.o; if (!Array.isArray(o)) o = L.map(k => r[k]);
    const qt = r.question || r.q, a = parseAns(r);
    if (!qt || !o || o.length !== 4 || o.some(x => !String(x || '').trim()) || a < 0) { bad.push(i + 1); return; }
    ok.push({subject:normSubject(r.subject || r.sub, r.paper) || def.subject || '', chapter:r.chapter || r.ch || def.chapter || '', board:String(r.board || def.board || '').replace(/\s*বোর্ড$/, ''), year:String(r.year || def.year || ''),
      question:String(qt).trim(), options:o.map(x => String(x).trim()), answer:a, explanation:r.explanation || r.ex || '', imageUrl:r.imageUrl || '',
      stimulus:String(r.stimulus || r.uddipok || '').trim(), stimulusImageUrl:String(r.stimulusImageUrl || '').trim(),
      statements:Array.isArray(r.statements) ? r.statements.map(x => String(x).trim()).filter(Boolean) : [],
      optionImageUrls:Array.isArray(r.optionImageUrls) && r.optionImageUrls.length === 4 && r.optionImageUrls.some(x => String(x || '').trim()) ? r.optionImageUrls.map(x => String(x || '').trim()) : [],
      university:String(r.university || r.institution || '').trim(),
      session:r.session || '', unit:r.unit || '', difficulty:['সহজ','মাঝারি','কঠিন'].indexOf(r.difficulty) > -1 ? r.difficulty : 'মাঝারি'});
  });
  return {ok, bad};
}

document.addEventListener('click', async ev => {

    case 'xbank': { const e = byId(E, S.exq), bq = byId(Q, v), items = (e.items || []).concat([{question:bq.question, options:bq.options.slice(), answer:bq.answer, explanation:bq.explanation || '', src:bq.id}]); if (await run(updateDoc(doc(db, 'exams', e.id), {items}), 'প্রশ্ন যোগ হয়েছে')) log(e.name + ': ব্যাংক থেকে একটি প্রশ্ন নেওয়া হয়েছে'); return; }
    case 'xauto': {
      const e = byId(E, S.exq), mg = e.type === 'Mega', sb = $('xasub').value, chv = mg ? 'সব অধ্যায়' : $('xach').value, ins = mg ? $('xainst').value : '', cn = +$('xcnt').value || 0, cur = (e.items || []), ua = cur.map(x => x.src);

      for (let k = pool.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)), tmp = pool[k]; pool[k] = pool[j]; pool[j] = tmp; }

    case 'uopen': S.us = S.us === v ? null : v; render(); return;
    case 'blk': { const u = byId(U, v); if (await run(updateDoc(doc(db, 'users', v), {blocked: !u.blocked}), u.blocked ? 'আনব্লক হয়েছে' : 'ব্লক হয়েছে')) log(userName(u) + (u.blocked ? ' আনব্লক' : ' ব্লক') + ' করা হয়েছে'); return; }
    case 'xp': { const i = v.lastIndexOf(':'), id = v.slice(0, i), d = +v.slice(i + 1), u = byId(U, id); if (await run(updateDoc(doc(db, 'users', id), {xp: increment(d)}), 'XP আপডেট হয়েছে')) log(userName(u) + '-এর XP ' + (d > 0 ? 'বাড়ানো' : 'কমানো') + ' হয়েছে'); return; }
    case 'rkhide': { const u = byId(U, v); await run(updateDoc(doc(db, 'users', v), {hidden: !u.hidden}), u.hidden ? 'তালিকায় দেখানো হবে' : 'মেধা তালিকা থেকে লুকানো হয়েছে'); return; }
    case 'reset': { if (!ask('rp' + v)) return; const u = byId(U, v); if (await run(updateDoc(doc(db, 'users', v), {xp: 0}), 'XP রিসেট হয়েছে')) log(userName(u) + '-এর XP রিসেট হয়েছে'); return; }
    case 'addm': { const mt = $('mt'); if (!mt.value.trim()) return toast('মিশনের নাম লিখুন'); const list = CFG.missions.concat([{t:mt.value.trim(), xp:50, on:true}]); if (await run(setDoc(doc(db, 'config', 'missions'), {list}), 'মিশন যোগ হয়েছে')) log('নতুন মিশন যোগ হয়েছে'); return; }
    case 'delm': { if (!ask('m' + v)) return; const list = CFG.missions.slice(); list.splice(+v, 1); await run(setDoc(doc(db, 'config', 'missions'), {list}), 'মিশন মুছে গেছে'); return; }
    case 'savem': { const list = CFG.missions.map((m, i) => ({t:m.t, xp:+$('mxp' + i).value || 0, on:$('mon' + i).checked})); if (await run(setDoc(doc(db, 'config', 'missions'), {list}), 'মিশন সেভ হয়েছে')) log('মিশন বদলানো হয়েছে'); return; }
    case 'addc': { const nc = $('nch'); if (!nc.value.trim()) return toast('অধ্যায়ের নাম লিখুন'); const data = JSON.parse(JSON.stringify(CFG.struct)); data[S.sSub] = (data[S.sSub] || []).concat([nc.value.trim()]); if (await run(setDoc(doc(db, 'config', 'struct'), {data}), 'অধ্যায় যোগ হয়েছে')) log('নতুন অধ্যায় যোগ: ' + nc.value.trim()); return; }
    case 'delc': { if (!ask('c' + v)) return; const data = JSON.parse(JSON.stringify(CFG.struct)); data[S.sSub].splice(+v, 1); await run(setDoc(doc(db, 'config', 'struct'), {data}), 'অধ্যায় মুছে গেছে'); return; }
    case 'adds': { const ns = $('nsub'), nm = ns.value.trim(); if (!nm || CFG.struct[nm]) return toast('নতুন নাম লিখুন'); const data = JSON.parse(JSON.stringify(CFG.struct)); data[nm] = []; S.sSub = nm; if (await run(setDoc(doc(db, 'config', 'struct'), {data}), 'বিষয় যোগ হয়েছে')) log('নতুন বিষয় যোগ: ' + nm); return; }
    case 'fixr': S.eq = v; S.qseg = 'form'; S.tab = 'q'; render(); window.scrollTo(0, 0); return;
    case 'rsolve': await run(updateDoc(doc(db, 'reports', v), {status:'সমাধান হয়েছে'}), 'সমাধান হিসেবে চিহ্নিত'); return;
    case 'rdrop': await run(deleteDoc(doc(db, 'reports', v)), 'রিপোর্ট বাতিল হয়েছে'); return;
    case 'sendn': { const nt = $('nt'); if (!nt.value.trim()) return toast('বার্তা লিখুন'); if (await run(addDoc(collection(db, 'notices'), {text:nt.value.trim(), audience:$('na').value, kind:$('nk').value, at:serverTimestamp()}), 'নোটিশ সেভ হয়েছে')) { log('নোটিশ পাঠানো হয়েছে'); nt.value = ''; } return; }
    case 'deln': if (!ask('n' + v)) return; await run(deleteDoc(doc(db, 'notices', v)), 'নোটিশ মুছে গেছে'); return;
    case 'savec': if (await run(setDoc(doc(db, 'config', 'app'), {ver:$('cv').value.trim(), support:$('cs').value.trim()}, {merge:true}), 'সেভ হয়েছে')) log('অ্যাপের তথ্য আপডেট হয়েছে'); return;
    case 'copyrules': { const t = $('rulebox'); try { await navigator.clipboard.writeText(t.value); toast('কপি হয়েছে'); } catch(e) { t.select(); toast('লেখাটি বাছা হয়েছে, কপি করে নিন'); } return; }
  }
});
document.addEventListener('change', async ev => {
  const t = ev.target, a = t.dataset && t.dataset.a, v = t.dataset && t.dataset.v;
  if (a === 'toge') {
    const e = byId(E, v);
    if (t.checked && Array.isArray(e.items) && e.items.length < e.count) { render(); toast('প্রশ্ন অসম্পূর্ণ: ' + bn(e.items.length) + '/' + bn(e.count) + ' যোগ হয়েছে। বাকি ' + bn(e.count - e.items.length) + 'টি যোগ করুন'); return; }
    if (await run(updateDoc(doc(db, 'exams', v), {live: t.checked, status: t.checked ? 'চালু' : 'খসড়া'}), t.checked ? 'পরীক্ষা চালু হয়েছে' : 'পরীক্ষা বন্ধ হয়েছে')) log(e.name + (t.checked ? ' চালু হয়েছে' : ' বন্ধ হয়েছে'));
    else render();
    return;
  }
  if (a === 'ctl') { if (await run(setDoc(doc(db, 'config', 'app'), {[v]: t.checked}, {merge:true}), 'সেটিং সেভ হয়েছে')) log('অ্যাপ কন্ট্রোল বদলেছে: ' + v); else render(); return; }
  if (a === 'sec') { await run(setDoc(doc(db, 'config', 'security'), {['i' + v]: t.checked}, {merge:true})); return; }
  if (a === 'impfile' || a === 'ximpfile') { const f = t.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('itext').value = r.result; }; r.readAsText(f); return; }
  if (t.id === 'qsub') { S.qsub = t.value; render(); }
  else if (t.id === 'qbank') { S.qbank = t.value; render(); }
  else if (t.id === 'qst') { S.qst = t.value; render(); }
  else if (t.id === 'ufil') { S.ufil = t.value; render(); }
  else if (t.id === 'ssub') { S.sSub = t.value; render(); }
  else if (t.id === 'rxs') { S.rx = t.value; render(); }
  else if (t.id === 'xasub') { S.xasub = t.value; render(); }
  else if (t.id === 'xainst') { S.xainst = t.value; render(); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'qs') { S.qf = t.value; S.qlimit = 50; render(); const n = $('qs'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
  else if (t.id === 'us') { S.uq = t.value; render(); const n = $('us'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && (ev.target.id === 'pw' || ev.target.id === 'em')) login(); });
document.addEventListener('submit', async ev => {
  ev.preventDefault(); const f = ev.target;
  if (f.id === 'fq') {
    const a = f.querySelector('input[name=ans]:checked'), o = [0,1,2,3].map(i => $('o' + i).value.trim());
    if (!$('fq1').value.trim()) { $('fmsg').textContent = 'প্রশ্ন লিখুন।'; return; }
    if (o.some(x => !x)) { $('fmsg').textContent = 'চারটি অপশনই লিখুন।'; return; }
    if (!a) { $('fmsg').textContent = 'সঠিক উত্তর বেছে নিন। উত্তর ছাড়া প্রশ্ন সেভ হয় না।'; return; }
    const d = {bank:$('fbk').value, status:$('fst').value, type:'MCQ', subject:$('fs').value, board:$('fb').value, year:String($('fy').value), difficulty:$('fd').value, chapter:$('fc').value.trim(), session:$('fss').value.trim(), unit:$('fun').value.trim(),
      question:$('fq1').value.trim(), options:o, answer:+a.value, explanation:$('fe').value.trim(), imageUrl:$('fi').value.trim(),
      stimulus:$('fstim').value.trim(), stimulusImageUrl:$('fsi').value.trim(), statements:$('fst2').value.split('\n').map(x => x.trim()).filter(Boolean),
      optionImageUrls:[0,1,2,3].map(i => $('oi' + i).value.trim()), updatedAt:serverTimestamp()};
    if (!d.optionImageUrls.some(Boolean)) d.optionImageUrls = [];
    if (d.bank === 'বিশ্ববিদ্যালয়' || d.bank === 'মেগা') d.university = d.board;
    const ok = S.eq ? await run(updateDoc(doc(db, 'questions', S.eq), d), 'পরিবর্তন সেভ হয়েছে') : await run(addDoc(collection(db, 'questions'), {...d, createdAt:serverTimestamp()}), 'প্রশ্ন সেভ হয়েছে');
    if (ok) { log(S.eq ? 'একটি প্রশ্ন এডিট করা হয়েছে' : 'নতুন প্রশ্ন যোগ হয়েছে (' + d.bank + ')'); S.eq = null; S.qseg = 'list'; render(); }
    return;
  }
  if (f.id === 'fe2') {
    const neg = $('eng').value === 'নেই' ? 0 : ($('eng').value === '০.৫' ? 0.5 : 0.25), type = $('et').value;
    const data = {name:$('en').value.trim(), type, subject:$('esub').value, inst:$('einst').value, duration:+$('em').value || 20, count:+$('eq').value || 20, negative:neg, passMark:+$('epm').value || 0,
      startAt:$('ew').value || '', showAnswer:$('eshow').checked, live:false, status:'খসড়া', items:[], createdAt:serverTimestamp()};
    try {
      const ref = await addDoc(collection(db, 'exams'), data);
      log('নতুন পরীক্ষা তৈরি: ' + data.name); toast('পরীক্ষা তৈরি হয়েছে। এবার প্রশ্ন যোগ করুন');
      S.exq = ref.id; S.eseg = 'items'; S.iseg = (type === 'Live' || type === 'Weekly') ? 'add' : 'auto'; S.xasub = S.xainst = null; render();
    } catch(e) { toast(errMsg(e)); }
    return;
  }
  if (f.id === 'fxq') {
    const e = byId(E, S.exq), a = f.querySelector('input[name=xa]:checked'), o = [0,1,2,3].map(i => $('xo' + i).value.trim());
    if (!a) { $('xmsg').textContent = 'সঠিক উত্তর বেছে নিন।'; return; }
    if (o.some(x => !x)) { $('xmsg').textContent = 'চারটি অপশনই লিখুন।'; return; }
    const items = (e.items || []).concat([{question:$('xq').value.trim(), options:o, answer:+a.value, explanation:$('xe').value.trim()}]);
    if (await run(updateDoc(doc(db, 'exams', e.id), {items}), 'প্রশ্ন যোগ হয়েছে (' + bn(items.length) + '/' + bn(e.count) + ')')) { log(e.name + ': নতুন প্রশ্ন যোগ হয়েছে'); S.iseg = 'add'; render(); }
  }
});
$('lookbtn').innerHTML = icon('brush'); $('lookbtn').onclick = () => go('look');
$('outbtn').innerHTML = icon('out'); $('outbtn').onclick = () => signOut(auth);
$('logo').innerHTML = icon('exam').replace('<svg', '<svg width="20" height="20"');
const h = (location.hash || '').slice(1); if (V[h]) S.tab = h;
applyLook();

</script>
