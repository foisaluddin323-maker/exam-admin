<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Master অ্যাডমিন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#14211b;--mute:#6a7770;--line:#dfe4de;--pri:#0e6ba8;--ok:#1f8a4c;--bad:#c0392b;--warn:#e8a317}
*{box-sizing:border-box}
body{margin:0;font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
header{position:sticky;top:0;background:var(--ink);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header b{font-size:18px}
main{padding:14px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:18px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:8px;background:#fff}
textarea{min-height:90px}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
button.g{background:#e9ede8;color:var(--ink)}button.r{background:var(--bad)}button.s{padding:6px 10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:12px 2px;font-size:13px}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat b{font-size:26px;display:block}
.q{border-bottom:1px solid var(--line);padding:10px 0}
.q:last-child{border:0}.q small{color:var(--mute)}
.tag{display:inline-block;background:#e9f1f7;color:var(--pri);border-radius:6px;padding:1px 8px;font-size:12px;margin-right:4px}
.live{background:#fdf1d3;color:#8a5d00}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:90%}
.hide{display:none}
.err{color:var(--bad);font-size:14px}
</style>
</head>
<body>
<div id="toast"></div>

<div id="loginView" style="max-width:380px;margin:12vh auto;padding:16px">
  <div class="card">
    <h2>Exam Master অ্যাডমিন</h2>
    <input id="em" type="email" placeholder="ইমেইল">
    <input id="pw" type="password" placeholder="পাসওয়ার্ড">
    <button style="width:100%" onclick="login()">লগইন করুন</button>
    <p id="loginErr" class="err"></p>
  </div>
</div>

<div id="appView" class="hide">
<header><b>Exam Master</b><button class="g s" onclick="logout()">লগআউট</button></header>
<main>

<section id="p-home">
  <div class="stat">
    <div><b id="cQ">0</b>প্রশ্ন</div>
    <div><b id="cE">0</b>পরীক্ষা</div>
    <div><b id="cU">0</b>ইউজার</div>
  </div>
  <div class="card" style="margin-top:12px"><h2>লাইভ পরীক্ষা</h2><div id="liveBox">কোনো লাইভ পরীক্ষা নেই</div></div>
</section>

<section id="p-q" class="hide">
  <div class="card">
    <h2 id="qTitle">নতুন প্রশ্ন</h2>
    <input type="hidden" id="qId">
    <div class="row"><input id="qSub" placeholder="বিষয় (যেমন ICT)"><input id="qCh" placeholder="অধ্যায়"></div>
    <div class="row"><input id="qBoard" placeholder="বোর্ড"><input id="qYear" placeholder="সাল"></div>
    <textarea id="qText" placeholder="প্রশ্ন"></textarea>
    <input id="oA" placeholder="ক"><input id="oB" placeholder="খ"><input id="oC" placeholder="গ"><input id="oD" placeholder="ঘ">
    <select id="qAns"><option value="">সঠিক উত্তর বাছাই করুন</option><option value="0">ক</option><option value="1">খ</option><option value="2">গ</option><option value="3">ঘ</option></select>
    <textarea id="qExp" placeholder="ব্যাখ্যা"></textarea>
    <input id="qImg" placeholder="ছবির লিংক (ঐচ্ছিক)">
    <div class="row"><button onclick="saveQ()">সেভ করুন</button><button class="g" onclick="clearQ()">খালি করুন</button></div>
  </div>
  <div class="card">
    <h2>সব প্রশ্ন</h2>
    <input id="qSearch" placeholder="খুঁজুন..." oninput="renderQ()">
    <select id="qFilter" onchange="renderQ()"><option value="">সব বিষয়</option></select>
    <div id="qList"></div>
  </div>
</section>

<section id="p-imp" class="hide">
  <div class="card">
    <h2>একসাথে অনেক প্রশ্ন যোগ</h2>
    <p style="color:var(--mute);margin-top:0">JSON ফাইল বা লেখা দিন। উত্তর না থাকলে বা ভুল হলে ওই প্রশ্ন নেওয়া হবে না — আন্দাজে উত্তর বসানো হয় না।</p>
    <input type="file" id="impFile" accept=".json,.txt" onchange="readFile(this)">
    <textarea id="impText" placeholder='[{"question":"...","options":["ক","খ","গ","ঘ"],"answer":"খ","subject":"ICT"}]' style="min-height:140px"></textarea>
    <button onclick="checkImp()">আগে যাচাই করুন</button>
    <div id="impRes" style="margin:10px 0"></div>
    <button id="impGo" class="hide" onclick="doImp()">Firebase-এ যোগ করুন</button>
  </div>
</section>

<section id="p-ex" class="hide">
  <div class="card">
    <h2>নতুন পরীক্ষা</h2>
    <input id="eName" placeholder="পরীক্ষার নাম">
    <div class="row"><input id="eSub" placeholder="বিষয়"><input id="eDur" type="number" placeholder="সময় (মিনিট)"></div>
    <div class="row"><input id="eCnt" type="number" placeholder="প্রশ্নের সংখ্যা"><input id="eNeg" type="number" step="0.05" placeholder="নেগেটিভ মার্ক (০.২৫)"></div>
    <button onclick="saveE()">পরীক্ষা তৈরি করুন</button>
  </div>
  <div class="card"><h2>সব পরীক্ষা</h2><div id="eList"></div></div>
</section>

<section id="p-us" class="hide">
  <div class="card"><h2>ইউজার</h2><input id="uSearch" placeholder="খুঁজুন..." oninput="renderU()"><div id="uList"></div></div>
</section>

</main>
<nav>
  <button class="on" data-p="home" onclick="go('home')">হোম</button>
  <button data-p="q" onclick="go('q')">প্রশ্ন</button>
  <button data-p="imp" onclick="go('imp')">ইমপোর্ট</button>
  <button data-p="ex" onclick="go('ex')">পরীক্ষা</button>
  <button data-p="us" onclick="go('us')">ইউজার</button>
</nav>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== ধাপ ১: এখানে নিজের Firebase config বসান ====== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "exam-master",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
const ADMIN_UID = "4rjBB5yWMdcWudnLPihP1ddjVaH2";
/* ================================================== */

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
let Q = [], E = [], U = [], pending = [], unsubs = [];

window.toast = m => { const t=$('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2800); };
window.go = p => {
  ['home','q','imp','ex','us'].forEach(x => $('p-'+x).classList.toggle('hide', x!==p));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.p===p));
  scrollTo(0,0);
};
window.login = async () => {
  $('loginErr').textContent='';
  try { await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value); }
  catch(e){ $('loginErr').textContent='লগইন হয়নি। ইমেইল ও পাসওয়ার্ড ঠিক আছে কিনা দেখুন।'; }
};
window.logout = () => signOut(auth);

onAuthStateChanged(auth, u => {
  unsubs.forEach(f=>f()); unsubs=[];
  if (u && u.uid === ADMIN_UID) {
    $('loginView').classList.add('hide'); $('appView').classList.remove('hide'); listen();
  } else {
    if (u) { signOut(auth); $('loginErr').textContent='এই অ্যাকাউন্টের অ্যাডমিন অনুমতি নেই।'; }
    $('loginView').classList.remove('hide'); $('appView').classList.add('hide');
  }
});

function listen(){
  const on=(name,fn)=>unsubs.push(onSnapshot(collection(db,name),s=>fn(s.docs.map(d=>({id:d.id,...d.data()}))),e=>toast('ডেটা আনতে সমস্যা: '+e.code)));
  on('questions',d=>{Q=d;renderQ();stats();filters();});
  on('exams',d=>{E=d;renderE();stats();});
  on('users',d=>{U=d;renderU();stats();});
}
function stats(){
  $('cQ').textContent=Q.length; $('cE').textContent=E.length; $('cU').textContent=U.length;
  const l=E.filter(e=>e.live);
  $('liveBox').innerHTML = l.length ? l.map(e=>`<span class="tag live">লাইভ</span> ${esc(e.name)}`).join('<br>') : 'কোনো লাইভ পরীক্ষা নেই';
}
function filters(){
  const cur=$('qFilter').value, subs=[...new Set(Q.map(q=>q.subject).filter(Boolean))];
  $('qFilter').innerHTML='<option value="">সব বিষয়</option>'+subs.map(s=>`<option ${s===cur?'selected':''}>${esc(s)}</option>`).join('');
}
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=['ক','খ','গ','ঘ'];

/* ---- প্রশ্ন ---- */
window.renderQ = () => {
  const t=$('qSearch').value.toLowerCase(), f=$('qFilter').value;
  const list=Q.filter(q=>(!f||q.subject===f)&&(!t||(q.question||'').toLowerCase().includes(t))).slice(0,60);
  $('qList').innerHTML = list.length ? list.map(q=>`<div class="q">
    <div>${q.subject?`<span class="tag">${esc(q.subject)}</span>`:''}${q.board?`<span class="tag">${esc(q.board)} ${esc(q.year||'')}</span>`:''}</div>
    <div style="margin:6px 0">${esc(q.question)}</div>
    <small>উত্তর: ${L[q.answer]??'?'}</small>
    <div class="row" style="margin-top:6px"><button class="g s" onclick="editQ('${q.id}')">এডিট</button><button class="r s" onclick="delQ('${q.id}')">মুছুন</button></div></div>`).join('')
    : '<p style="color:var(--mute)">কোনো প্রশ্ন নেই। উপরে থেকে যোগ করুন।</p>';
};
window.clearQ = () => { ['qId','qSub','qCh','qBoard','qYear','qText','oA','oB','oC','oD','qAns','qExp','qImg'].forEach(i=>$(i).value=''); $('qTitle').textContent='নতুন প্রশ্ন'; };
window.editQ = id => {
  const q=Q.find(x=>x.id===id); if(!q) return;
  $('qId').value=id; $('qSub').value=q.subject||''; $('qCh').value=q.chapter||''; $('qBoard').value=q.board||''; $('qYear').value=q.year||'';
  $('qText').value=q.question||''; ['oA','oB','oC','oD'].forEach((k,i)=>$(k).value=(q.options||[])[i]||'');
  $('qAns').value=q.answer; $('qExp').value=q.explanation||''; $('qImg').value=q.imageUrl||'';
  $('qTitle').textContent='প্রশ্ন এডিট'; scrollTo(0,0);
};
window.saveQ = async () => {
  const opts=['oA','oB','oC','oD'].map(k=>$(k).value.trim());
  if(!$('qText').value.trim()) return toast('প্রশ্ন লিখুন');
  if(opts.some(o=>!o)) return toast('চারটি অপশনই লিখুন');
  if($('qAns').value==='') return toast('সঠিক উত্তর বাছাই করুন');
  const data={subject:$('qSub').value.trim(),chapter:$('qCh').value.trim(),board:$('qBoard').value.trim(),year:$('qYear').value.trim(),
    question:$('qText').value.trim(),options:opts,answer:+$('qAns').value,explanation:$('qExp').value.trim(),imageUrl:$('qImg').value.trim(),updatedAt:serverTimestamp()};
  try{
    const id=$('qId').value;
    if(id) await updateDoc(doc(db,'questions',id),data); else await addDoc(collection(db,'questions'),{...data,createdAt:serverTimestamp()});
    toast('সেভ হয়েছে'); clearQ();
  }catch(e){toast('সেভ হয়নি: '+e.code);}
};
window.delQ = async id => { if(confirm('এই প্রশ্ন মুছবেন?')) try{await deleteDoc(doc(db,'questions',id));toast('মোছা হয়েছে');}catch(e){toast('সমস্যা: '+e.code);} };

/* ---- ইমপোর্ট (আন্দাজ নেই) ---- */
window.readFile = inp => { const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>$('impText').value=r.result; r.readAsText(f); };
function parseAns(a){
  if(a===undefined||a===null) return -1;
  const s=String(a).trim().toLowerCase();
  const m={'ক':0,'খ':1,'গ':2,'ঘ':3,'a':0,'b':1,'c':2,'d':3,'1':0,'2':1,'3':2,'4':3};
  return s in m ? m[s] : -1;
}
window.checkImp = () => {
  pending=[]; let bad=0, why=[];
  let arr; try{ arr=JSON.parse($('impText').value); if(!Array.isArray(arr)) throw 0; }catch(e){ $('impRes').innerHTML='<span class="err">JSON ঠিক নেই। [ ] এর ভেতরে প্রশ্নের তালিকা দিন।</span>'; $('impGo').classList.add('hide'); return; }
  arr.forEach((r,i)=>{
    let o=r.options; if(!Array.isArray(o)) o=['ক','খ','গ','ঘ'].map(k=>r[k]);
    const a=parseAns(r.answer);
    if(!r.question||!o||o.length!==4||o.some(x=>!String(x||'').trim())){bad++;why.push(i+1);return;}
    if(a<0){bad++;why.push(i+1);return;}
    pending.push({subject:r.subject||'',chapter:r.chapter||'',board:r.board||'',year:String(r.year||''),question:String(r.question).trim(),
      options:o.map(x=>String(x).trim()),answer:a,explanation:r.explanation||'',imageUrl:r.imageUrl||''});
  });
  $('impRes').innerHTML=`<b style="color:var(--ok)">ঠিক: ${pending.length}টি</b><br>`+(bad?`<span class="err">বাদ: ${bad}টি (উত্তর বা অপশন নেই/ভুল) — নম্বর: ${why.slice(0,30).join(', ')}</span>`:'');
  $('impGo').classList.toggle('hide',!pending.length);
};
window.doImp = async () => {
  try{
    for(let i=0;i<pending.length;i+=400){
      const b=writeBatch(db);
      pending.slice(i,i+400).forEach(q=>b.set(doc(collection(db,'questions')),{...q,createdAt:serverTimestamp()}));
      await b.commit();
    }
    toast(pending.length+'টি প্রশ্ন যোগ হয়েছে'); pending=[]; $('impText').value=''; $('impRes').innerHTML=''; $('impGo').classList.add('hide');
  }catch(e){toast('ইমপোর্ট হয়নি: '+e.code);}
};

/* ---- পরীক্ষা ---- */
window.saveE = async () => {
  if(!$('eName').value.trim()) return toast('পরীক্ষার নাম লিখুন');
  try{
    await addDoc(collection(db,'exams'),{name:$('eName').value.trim(),subject:$('eSub').value.trim(),duration:+$('eDur').value||20,
      count:+$('eCnt').value||20,negative:+$('eNeg').value||0,live:false,createdAt:serverTimestamp()});
    toast('পরীক্ষা তৈরি হয়েছে'); ['eName','eSub','eDur','eCnt','eNeg'].forEach(i=>$(i).value='');
  }catch(e){toast('সমস্যা: '+e.code);}
};
function renderE(){
  $('eList').innerHTML = E.length ? E.map(e=>`<div class="q"><div>${e.live?'<span class="tag live">লাইভ</span>':''}<b>${esc(e.name)}</b></div>
    <small>${esc(e.subject)} · ${e.count} প্রশ্ন · ${e.duration} মিনিট · নেগেটিভ ${e.negative}</small>
    <div class="row" style="margin-top:6px"><button class="s ${e.live?'g':''}" onclick="togLive('${e.id}',${!e.live})">${e.live?'লাইভ বন্ধ করুন':'লাইভ করুন'}</button>
    <button class="r s" onclick="delE('${e.id}')">মুছুন</button></div></div>`).join('') : '<p style="color:var(--mute)">এখনো কোনো পরীক্ষা নেই।</p>';
}
window.togLive = async (id,v) => { try{await updateDoc(doc(db,'exams',id),{live:v});}catch(e){toast('সমস্যা: '+e.code);} };
window.delE = async id => { if(confirm('এই পরীক্ষা মুছবেন?')) try{await deleteDoc(doc(db,'exams',id));}catch(e){toast('সমস্যা: '+e.code);} };

/* ---- ইউজার ---- */
window.renderU = () => {
  const t=$('uSearch').value.toLowerCase();
  const l=U.filter(u=>!t||JSON.stringify(u).toLowerCase().includes(t)).slice(0,60);
  $('uList').innerHTML = l.length ? l.map(u=>`<div class="q"><b>${esc(u.name||u.displayName||'নাম নেই')}</b><br><small>${esc(u.email||u.phone||u.id)}</small></div>`).join('') : '<p style="color:var(--mute)">কোনো ইউজার নেই।</p>';
};
</script>
</body>
</html>
